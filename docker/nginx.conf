# Static files only. There is deliberately NO /api proxy_pass here.
#
# A proxy to the backend would need this container to reach the API, which means
# the API bound off 127.0.0.1 -- and POST /control starts live trading with real
# money and has no authentication (CLAUDE.md, Safety). So the browser, which is
# on the host, calls the backend on the host's own loopback instead, and this
# server does one job: hand over the page. The backend's CORS list is what
# allows the cross-origin call, and it already defaults to :3000.
#
# The cost is that the dashboard only works from a browser on the MT5 host. That
# is the same constraint the loopback bind already imposed.
#
# Every location `include`s security-headers.conf rather than inheriting it from
# the server block. See that file: `add_header` replaces the inherited set
# instead of adding to it, so a server-level header is silently dropped by any
# location that sets one of its own -- and all of these set Cache-Control.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed CRA assets under /static/ are immutable by construction.
    location /static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # env.js is rewritten on every container start (frontend-entrypoint.sh), so
    # it must never be cached -- a cached copy would pin the dashboard to a
    # previous BOT_API_BASE and the page would silently poll the wrong host.
    location = /env.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # index.html carries the script tags for the current build's hashed assets.
    # Cached, it would ask for bundles a rebuild has already replaced.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback: the dashboard routes in the client, so an unknown path is a
    # route rather than a missing file.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
