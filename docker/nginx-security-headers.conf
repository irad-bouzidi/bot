# Included by EVERY location block in nginx.conf. Not set once at server level,
# because `add_header` does not merge: a location that declares any add_header
# of its own REPLACES the whole inherited set. Every location here sets its own
# Cache-Control, so server-level security headers reached none of them -- the
# page went out with no X-Frame-Options at all.
#
# This page holds the start/stop controls for a live trading account, so nothing
# about it should be embeddable or content-sniffable.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
